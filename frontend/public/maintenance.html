<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakımdayız | MAKUtalk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .glow { box-shadow: 0 0 80px rgba(37, 99, 235, 0.1); }
        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 overflow-hidden">
    <!-- Background Decor -->
    <div class="fixed inset-0 z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600/10 rounded-full blur-[120px]"></div>
    </div>

    <div class="relative z-10 text-center max-w-lg w-full">
        <!-- Logo -->
        <div class="mb-12 animate-float">
            <img src="/makutalklogo.png" alt="MAKUtalk" class="w-32 h-32 mx-auto drop-shadow-[0_0_25px_rgba(37,99,235,0.3)]">
        </div>

        <!-- Content -->
        <h1 class="text-4xl md:text-5xl font-black italic tracking-tighter mb-6">
            MAKU<span class="bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">talk</span>
        </h1>
        
        <div class="bg-white/5 border border-white/10 backdrop-blur-xl rounded-[2.5rem] p-8 glow">
            <div class="inline-flex p-3 rounded-2xl bg-blue-500/10 text-blue-400 mb-6">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold mb-3 uppercase tracking-tight">Kısa Bir Ara</h2>
            <p class="text-slate-400 leading-relaxed font-medium">
                Sana daha iyi bir deneyim sunmak için sistemi güncelliyoruz. Çok yakında buradayız, kahveni alıp gelene kadar bitmiş olur! ✨
            </p>
        </div>

        <!-- Footer -->
        <p class="mt-12 text-[10px] font-black uppercase tracking-[0.3em] text-slate-500 opacity-50 italic">
            MAKUtalk • Öğrenci Projesi Güncelleniyor
        </p>
    </div>
</body>
</html>
