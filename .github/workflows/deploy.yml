name: 🚀 MAKUtalk Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD,DATABASE_URL,JWT_SECRET,RESEND_API_KEY,GEMINI_API_KEY,SMTP_FROM,FRONTEND_URL,VITE_API_URL,VITE_CLARITY_ID
          script: |
            set -e

            mkdir -p ~/makutalk
            cd ~/makutalk

            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            cat > .env << ENVEOF
            DB_USERNAME=admin
            DB_PASSWORD=${DB_PASSWORD}
            DB_NAME=makutalk_db
            DATABASE_URL=${DATABASE_URL}
            JWT_SECRET=${JWT_SECRET}
            RESEND_API_KEY=${RESEND_API_KEY}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            SMTP_FROM=${SMTP_FROM}
            FRONTEND_URL=${FRONTEND_URL}
            VITE_API_URL=${VITE_API_URL}
            VITE_CLARITY_ID=${VITE_CLARITY_ID}
            ENVEOF

            docker compose down --remove-orphans

            # ── 1. Sadece DB ayağa kaldır ──────────────────────────────────
            echo "🐘 Veritabanı başlatılıyor..."
            docker compose up -d db

            echo "⏳ DB hazır olana kadar bekleniyor..."
            for i in $(seq 1 30); do
              docker compose exec -T db pg_isready -U admin -d makutalk_db && break
              echo "  ($i/30) Bekleniyor..."
              sleep 2
            done

            # ── 2. Sadece backend image'ını build et (container başlatma) ──
            echo "⚙️ Backend image build ediliyor..."
            docker compose build backend

            # ── 3. Migration'ı izole, tek seferlik container'da çalıştır ──
            # Backend app çalışmıyor → Prisma binary tek başına RAM kullanır
            echo "🗄️ Prisma schema güncelleniyor (izole container)..."
            docker compose run --rm \
              -e NODE_OPTIONS="--max-old-space-size=256" \
              backend \
              npx prisma db push --accept-data-loss

            # ── 4. Migration bitti, şimdi backend'i başlat ────────────────
            echo "🚀 Backend başlatılıyor..."
            docker compose up -d backend

            # ── 5. Frontend: build bitince eski container'ı değiştir ──────
            echo "🎨 Frontend build ediliyor..."
            docker compose build frontend
            docker compose up -d frontend

            # ── 6. Temizlik ───────────────────────────────────────────────
            docker image prune -f

            echo "✅ Deploy tamamlandı!"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLARITY_ID: ${{ secrets.VITE_CLARITY_ID }}
