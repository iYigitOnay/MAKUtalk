name: 🚀 MAKUtalk Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            mkdir -p ~/makutalk
            cd ~/makutalk

            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            cat > .env << ENVEOF
            DB_USERNAME=admin
            DB_PASSWORD=${DB_PASSWORD}
            DB_NAME=makutalk_db
            DATABASE_URL=${DATABASE_URL}
            JWT_SECRET=${JWT_SECRET}
            RESEND_API_KEY=${RESEND_API_KEY}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            SMTP_FROM=${SMTP_FROM}
            FRONTEND_URL=${FRONTEND_URL}
            VITE_API_URL=${VITE_API_URL}
            VITE_CLARITY_ID=${VITE_CLARITY_ID}
            ENVEOF

            # DB'yi kapatma — sadece backend/frontend'i durdur
            docker compose stop backend frontend

            # DB zaten çalışıyorsa atlat, yoksa başlat
            if ! docker compose ps db | grep -q "Up"; then
              echo "🐘 Veritabanı başlatılıyor..."
              docker compose up -d db

              echo "⏳ DB hazır olana kadar bekleniyor..."
              for i in $(seq 1 30); do
                docker compose exec -T db pg_isready -U admin -d makutalk_db && break
                echo "  ($i/30) Bekleniyor..."
                sleep 2
              done
            else
              echo "✅ DB zaten çalışıyor, atlanıyor."
            fi

            # Build'leri sırayla çalıştır (RAM dostu)
            echo "⚙️ Backend image build ediliyor..."
            docker compose build backend

            echo "🎨 Frontend image build ediliyor..."
            docker compose build frontend

            # Migration
            echo "🗄️ Prisma schema güncelleniyor..."
            docker compose run --rm \
              -e NODE_OPTIONS="--max-old-space-size=256" \
              backend \
              npx prisma db push --accept-data-loss

            # Servisleri başlat
            echo "🚀 Servisler başlatılıyor..."
            docker compose up -d backend frontend

            docker image prune -f

            echo "✅ Deploy tamamlandı!"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLARITY_ID: ${{ secrets.VITE_CLARITY_ID }}
