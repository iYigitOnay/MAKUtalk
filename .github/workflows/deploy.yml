name: 🚀 MAKUtalk Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD,DATABASE_URL,JWT_SECRET,RESEND_API_KEY,GEMINI_API_KEY,SMTP_FROM,FRONTEND_URL,VITE_API_URL
          script: |
            set -e

            mkdir -p ~/makutalk
            cd ~/makutalk

            # Repo yoksa clone, varsa pull
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            # .env dosyasını güvenli şekilde oluştur
            cat > .env << EOF
            DB_USERNAME=admin
            DB_PASSWORD=${DB_PASSWORD}
            DB_NAME=makutalk_db
            DATABASE_URL=${DATABASE_URL}
            JWT_SECRET=${JWT_SECRET}
            RESEND_API_KEY=${RESEND_API_KEY}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            SMTP_FROM=${SMTP_FROM}
            FRONTEND_URL=${FRONTEND_URL}
            VITE_API_URL=${VITE_API_URL}
            EOF

            # Build ve başlat (SIRALI BUILD - 1GB RAM Optimizasyonu)
            docker compose down --remove-orphans

            echo "🐘 Veritabanı başlatılıyor..."
            docker compose up -d db

            echo "⚙️ Backend build ediliyor..."
            docker compose build backend
            docker compose up -d backend

            echo "🎨 Frontend build ediliyor (RAM yoğun işlem)..."
            docker compose build frontend
            docker compose up -d frontend

            docker image prune -f

            echo "✅ Deploy tamamlandı!"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
